# Log the player straight in on tty1, with no password prompt.
#
# Install to /etc/systemd/system/getty@tty1.service.d/autologin.conf.
# The account is deliberately not a sudoer and has no password worth guessing;
# physical access to the machine is assumed, and the point is a laptop that
# opens up on merit rather than one that cannot be opened at all.
[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin aido --noclear %I $TERM
